[pytest]
testpaths = autotests/tests
python_files = test_*.py
addopts =
    -ra
    --strict-markers
    --tb=short
    --browser=chromium
    --tracing=retain-on-failure
    --screenshot=only-on-failure
markers =
    api: API-тесты.
    web: UI-тесты веб-приложения.
    critical: Критический приоритет тест-кейса.
    high: Высокий приоритет тест-кейса.
    medium: Средний приоритет тест-кейса.
    low: Низкий приоритет тест-кейса.
    positive: Позитивный сценарий.
    negative: Негативный сценарий.
    security: Проверки безопасности.
    validation: Проверки валидации данных.
    boundary: Проверки граничных значений.
    rbac: Проверки ролевого доступа.
    auth: Авторизация и управление сессией.
    localization: Проверки выбора языка и локализации интерфейса.
    ratelimit: Проверки ограничений частоты запросов.
    manual_setup: Кейсы, требующие ручной подготовки стенда.
    slow: Длительные тесты.
    serial: Тесты, которые нельзя выполнять параллельно.
    daily_uat: Минимальный ежедневный позитивный UAT-набор.
    uat_id(case_id): Связь одного pytest-item с одним идентификатором UAT-чеклиста.
